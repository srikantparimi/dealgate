name: e2e

# Playwright is heavier than the pytest AC + web vitest jobs (browser
# install alone is ~120 MB), so this workflow is opt-in:
#   - manual dispatch via the Actions tab
#   - push to `main` that includes `[e2e]` in the commit message
#   - nightly at 04:00 UTC to catch regressions before the standup
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

jobs:
  playwright:
    # Skip cron/push runs unless the commit opts in via `[e2e]`. Manual
    # dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[e2e]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealgate
          POSTGRES_PASSWORD: dealgate
          POSTGRES_DB: dealgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealgate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DEALGATE_ENV: local
      # Grant every role via the process-wide env so per-request
      # X-Test-User headers alone decide identity in specs.
      DEALGATE_TEST_GROUPS: "SystemAdmin,Sales,SalesLeader,Delivery,Presales,Finance,Legal,HR,CEO,Marketing"
      # Turn off real S3 / Bedrock / SES; the API respects _STUB flags.
      S3_STUB: "1"
      SOW_EXTRACT_STUB: "1"
      SIGNED_SOW_EXTRACT_STUB: "1"
      BEDROCK_STUB: "1"
      SES_STUB: "1"
      HUBSPOT_STUB: "1"
      DATABASE_URL: postgresql+psycopg://dealgate:dealgate@localhost:5432/dealgate
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            web/package.json
            tests/e2e/package.json

      - name: Install API deps
        working-directory: api
        run: pip install -e '.[dev]'

      - name: Run migrations
        working-directory: api
        run: alembic upgrade head

      - name: Start FastAPI
        working-directory: api
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > ../uvicorn.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: Install web deps
        working-directory: web
        run: npm install

      - name: Start Vite dev server
        working-directory: web
        env:
          VITE_TEST_USER: sales@smartek21.com
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 \
            > ../vite.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:5173 && break
            sleep 1
          done

      - name: Install e2e deps
        working-directory: tests/e2e
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck specs
        working-directory: tests/e2e
        run: npx tsc --noEmit

      - name: Run Playwright suite
        working-directory: tests/e2e
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            uvicorn.log
            vite.log
          retention-days: 7
