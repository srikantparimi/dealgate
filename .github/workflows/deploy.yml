name: deploy

# Deploys `main` to the dev environment:
#   * api  → build arm64 image, push to ECR, register a new ECS task
#            definition revision, run migrations one-off, then update the
#            long-running service to the new revision.
#   * web  → build the Vite bundle with the Cognito envs pulled from repo
#            secrets, sync to S3, invalidate CloudFront.
#
# `web` and the `api-build` job run in parallel. The service update waits on
# the migration job so a bad migration never rolls forward the running task.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: officeapp-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPO: officeapp-dev-api
  ECS_CLUSTER: officeapp-dev
  ECS_SERVICE: officeapp-dev-api
  ECS_TASK_FAMILY: officeapp-dev-api
  ECS_CONTAINER_NAME: api
  ECS_MIGRATE_TASK_FAMILY: officeapp-dev-api-migrate
  S3_BUCKET: officeapp-dev-web

jobs:
  # -----------------------------------------------------------------------
  # API: build + push image
  # -----------------------------------------------------------------------
  api-build:
    name: api / build + push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image URIs
        id: image
        run: |
          registry="${{ steps.ecr.outputs.registry }}"
          echo "uri=${registry}/${ECR_REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${registry}/${ECR_REPO}:latest" >> "$GITHUB_OUTPUT"

      # S14a.3b: context is repo root (not api/) so the image bundles worker/
      # alongside api/app. Fargate task runs amd64 (see runtime_platform in
      # infra-tf/modules/api and modules/schedulers). The workflow used to say
      # arm64 but every image actually in ECR is amd64 — the arm64 line was
      # aspirational and never landed.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------
  # API: register new task definition revisions (service + migrate)
  # -----------------------------------------------------------------------
  api-register:
    name: api / register task definition
    runs-on: ubuntu-latest
    needs: api-build
    outputs:
      service_task_def: ${{ steps.render.outputs.service_task_def }}
      migrate_task_def: ${{ steps.render.outputs.migrate_task_def }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definitions and patch image
        id: render
        env:
          NEW_IMAGE: ${{ needs.api-build.outputs.image }}
        run: |
          set -euo pipefail

          fetch_and_patch() {
            local family="$1"
            local outfile="$2"
            aws ecs describe-task-definition \
              --task-definition "$family" \
              --query 'taskDefinition' \
              > "$outfile.raw"
            # Strip fields that describe-task-definition returns but
            # register-task-definition rejects.
            jq --arg image "$NEW_IMAGE" --arg name "$ECS_CONTAINER_NAME" '
              .containerDefinitions |= map(
                if .name == $name then .image = $image else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ' "$outfile.raw" > "$outfile"
          }

          fetch_and_patch "$ECS_TASK_FAMILY" service.json
          fetch_and_patch "$ECS_MIGRATE_TASK_FAMILY" migrate.json

          svc_arn=$(aws ecs register-task-definition \
            --cli-input-json file://service.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          mig_arn=$(aws ecs register-task-definition \
            --cli-input-json file://migrate.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "service_task_def=$svc_arn" >> "$GITHUB_OUTPUT"
          echo "migrate_task_def=$mig_arn" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # API: run migrations as a one-off task, block on success
  # -----------------------------------------------------------------------
  api-migrate:
    name: api / run migrations
    runs-on: ubuntu-latest
    needs: api-register
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run migration task and wait
        env:
          TASK_DEF: ${{ needs.api-register.outputs.migrate_task_def }}
          SUBNETS: ${{ secrets.ECS_PRIVATE_SUBNETS }}
          SECURITY_GROUPS: ${{ secrets.ECS_TASK_SECURITY_GROUPS }}
        run: |
          set -euo pipefail
          task_arn=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            echo "Migration failed" >&2
            exit 1
          fi

  # -----------------------------------------------------------------------
  # API: roll the service to the new task definition
  # -----------------------------------------------------------------------
  api-deploy:
    name: api / update service
    runs-on: ubuntu-latest
    needs: [api-register, api-migrate]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service to new task definition
        env:
          TASK_DEF: ${{ needs.api-register.outputs.service_task_def }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

  # -----------------------------------------------------------------------
  # Web: build, sync to S3, invalidate CloudFront
  # -----------------------------------------------------------------------
  web-deploy:
    name: web / build + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web bundle
        working-directory: web
        env:
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ secrets.VITE_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ secrets.VITE_COGNITO_LOGOUT_URI }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync web/dist/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_ID }}" \
            --paths '/*'
