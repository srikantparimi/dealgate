[project]
name = "dealgate-api"
version = "0.0.1"
description = "DealGate API service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "structlog>=24.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  # aiobotocore is loaded lazily by app.integrations.ses; only the sender
  # worker image needs it at runtime, but keeping it in the API deps
  # simplifies the shared container recipe.
  "aiobotocore>=2.13",
  # pypdf: local text-density probe before deciding to OCR (sow_extract).
  "pypdf>=4.3",
  # boto3: Textract client is sync; only imported by the extract path.
  "boto3>=1.34",
  # rapidfuzz: fuzzy string ratio for `services/client_resolver`
  # (S10-01). C++ backed, deterministic; used only in the resolver so a
  # future ratchet to a smarter matcher stays local.
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.112",
  "aiosqlite>=0.20",
  # asyncpg: `test_audit_hardening` opens its own async engine against
  # Postgres to prove the append-only trigger rejects UPDATE and DELETE. It
  # was previously never exercised — the suite skipped without
  # DEALGATE_POSTGRES_URL — so the missing driver went unnoticed until CI
  # gained a Postgres service and un-skipped it.
  "asyncpg>=0.29",
  # Deterministic PDF builder for the fixture SOWs under
  # `fixtures/sample_sows/`. Only used by dev + CI, never at runtime.
  "reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Pin the rule set explicitly. With no `select`, the active rules are whatever
# the installed ruff version happens to default to — which drifts between
# releases, so the same code lints clean locally and fails in CI (or the
# reverse). This is ruff's historical default set, stated outright.
#
# Deliberately NOT enabled:
#   B008    — flags FastAPI's `Depends()` / `File()` in defaults, which is the
#             framework's documented idiom, not a bug.
#   FURB157 — wants `Decimal(0)` over `Decimal("0")`, but CLAUDE.md rule 2
#             requires string construction so money never round-trips a float.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
