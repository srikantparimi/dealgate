[project]
name = "dealgate-api"
version = "0.0.1"
description = "DealGate API service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "structlog>=24.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "openpyxl>=3.1",
  # aiobotocore is loaded lazily by app.integrations.ses; only the sender
  # worker image needs it at runtime, but keeping it in the API deps
  # simplifies the shared container recipe.
  "aiobotocore>=2.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.112",
  "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
