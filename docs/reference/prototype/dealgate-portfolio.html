    else if(b.dataset.act==="leave"){ const t=new Date(); const y=t.getUTCFullYear(),m=t.getUTCMonth(); a.end=iso(new Date(Date.UTC(y,m,dim(y,m)))); if(e.sameDates){e.sameDates=false;} }
    else if(b.dataset.act==="rehire"){ const end=d(a.end||e.end); const ns=new Date(Date.UTC(end.getUTCFullYear(),end.getUTCMonth()+1,1)); e.allocs.splice(i+1,0,{...a,id:nid(),start:iso(ns),end:"",role:a.role+" (re-hire)"}); if(e.sameDates){e.sameDates=false;} }

  const add=$("#add"); if(add) add.onclick=()=>{ e.allocs.push({id:nid(),person:"",role:"",seniority:"Mid",location:"US",emp:"w2_employee",assignment:"",util:1,bill:null,basis:"hourly",cost:null,start:"",end:""}); save(); render(); };
  // setup edits
  const S=id=>$("#"+id); if(S("s-type")){ S("s-type").onchange=x=>{e.type=x.target.value;save();render()}; S("s-start").onchange=x=>{e.start=x.target.value;save();render()}; S("s-end").onchange=x=>{e.end=x.target.value;save();render()};

    document.querySelectorAll("tr[data-ci] [data-cf]").forEach(el=>el.onchange=()=>{const c=e.costs[+el.closest("tr").dataset.ci];const k=el.dataset.cf;c[k]=k==="amount"?+el.value:k==="billed"?el.value==="1":el.value;save();render()});
    document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{e.costs.splice(+b.dataset.cdel,1);save();render()});

function parseWorkbook(wb){
  const ws=wb.Sheets["Cost Margin"]; if(!ws) throw new Error("no 'Cost Margin' sheet — is this the DealGate sheet?");
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}); const low=v=>v==null?"":String(v).trim().toLowerCase(); const txt=v=>v==null?"":String(v).trim();
  const num=v=>{ if(v==null||txt(v)==="") return null; const n=typeof v==="number"?v:parseFloat(txt(v).replace(/[$,%]/g,"")); return isNaN(n)?null:n; };
  const dt=v=>{ if(v==null||txt(v)==="") return ""; if(v instanceof Date) return iso(new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()))); const m=txt(v).match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0]; const u=txt(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(u) return `${u[3]}-${u[1].padStart(2,"0")}-${u[2].padStart(2,"0")}`; return ""; };
  const label=p=>{ for(const r of rows.slice(0,40)) if(low(r[0]).startsWith(p)) return r[1]; return null; };
  const TYPES_={"fixed cost":"fixed_cost",assessment:"assessment",msp:"msp","time & materials":"time_and_materials","staff augmentation":"staff_augmentation"};
  const errors=[],warnings=[]; const type=TYPES_[low(label("engagement type"))]; if(!type) errors.push("Engagement type not picked on the sheet");
  const client=txt(label("client")); let name=txt(label("project / engagement name")||label("project name")); if(!client) errors.push("Client is blank");
  if(!name){ name=client+" engagement"; warnings.push("Project name blank — placeholder used"); }
  const start=dt(label("project start")), end=dt(label("project end")); if(!start||!end) errors.push("Project dates missing");
  const price=num(label("total project price")), fee=num(label("monthly fee"));
  if(["fixed_cost","assessment"].includes(type)&&price==null) errors.push("Total project price required"); if(type==="msp"&&fee==null) errors.push("Monthly fee required");
  const addl=low(label("additional costs on this project")).startsWith("y"); const same=low(label("same start/end")).startsWith("y");
  const hdrIdx=rows.findIndex(r=>r.some(c=>low(c).startsWith("role"))); const allocs=[]; const costs=[];
  if(hdrIdx<0) errors.push("Staffing table not found"); else {
    const H=rows[hdrIdx].map(low); const col=(...ps)=>{ for(const p of ps){ const i=H.findIndex(h=>h&&h.startsWith(p)); if(i>=0) return i; } return -1; };
    const cR=col("role"),cS=col("seniority"),cL=col("location"),cE=col("employment"),cA=col("assignment"),cU=col("utilization"),cB=col("bill rate"),cC=col("our cost","cost / hour","cost/hour"),cSt=col("start"),cEn=col("end"),cO=col("hours override");
    if(cE<0) warnings.push("No Employment type column in this copy — everyone imported as W-2; fix any 1099s");
    for(const r of rows.slice(hdrIdx+1,hdrIdx+60)){ const role=txt(r[cR]); if(!role) continue; if(low(role).startsWith("staffing total")) break;
      const emp=cE>=0&&/1099|contractor/.test(low(r[cE]))?"contractor_1099":"w2_employee"; let util=num(r[cU]); util=util==null?1:(util>1?util/100:util);
      let st=cSt>=0?dt(r[cSt]):"", en=cEn>=0?dt(r[cEn]):""; if(st===start&&en===end){st="";en="";}
      const loc=txt(r[cL])||"US"; if(!txt(r[cL])) warnings.push(role+": location blank, assumed US");
      if(HOURLY.has(type)&&num(r[cB])==null) errors.push(role+": bill rate required");
      allocs.push({id:nid(),role,seniority:txt(r[cS])||"Mid",location:loc,emp,assignment:cA>=0?txt(r[cA]):"",util,bill:cB>=0?num(r[cB]):null,cost:cC>=0?num(r[cC]):null,start:st,end:en,override:cO>=0?num(r[cO]):null}); }
    if(!allocs.length) errors.push("No staffing rows"); }
  const cIdx=rows.findIndex(r=>low(r[0]).startsWith("description"));
  if(cIdx>=0){ const H=rows[cIdx].map(low); const col=p=>H.findIndex(h=>h&&h.startsWith(p)); const cD=col("description"),cAm=col("amount"),cF=col("frequency"),cBi=col("billed to client");
    for(const r of rows.slice(cIdx+1,cIdx+40)){ const desc=txt(r[cD]); if(!desc) continue; if(low(desc).startsWith("additional costs total")) break; const amt=num(r[cAm]); if(amt==null){warnings.push("Cost '"+desc+"' has no amount; skipped");continue;}
      const billedRaw=cBi>=0?low(r[cBi]):""; if(addl&&!billedRaw) errors.push("Cost '"+desc+"': Billed to client Y/N blank");
      costs.push({desc,amount:amt,freq:cF>=0&&low(r[cF]).startsWith("month")?"monthly":"one_time",billed:billedRaw.startsWith("y")}); } }
  return {errors,warnings,type,client,name,start,end,price,fee,addl,same,allocs,costs,currency:txt(label("currency"))||"USD"};
}

}
// ---------------------------------------------------------------- import the forecast model master (dry run first)
// The real importer is app/services/forecast/forecast_model_import.py (header-driven, one row per person, month blocks).
// This prototype only reads enough of the workbook to show the dry-run shape: dashboard → BUs/clients, tabs → people.
function dryRunModel(wb){
  const BU_SET={"st21":"ST21","it avalon":"IT Avalon","retro rabbit":"Retro Rabbit"}; const dash={}; let bu=null;
  const ds=wb.Sheets["Dashboard (RunRate)"]; if(!ds) return {error:"No 'Dashboard (RunRate)' tab — is this the forecast model master?"};
  const rows=XLSX.utils.sheet_to_json(ds,{header:1,raw:true});
  rows.forEach(r=>{ const name=(r[1]??"").toString().trim(); if(!name) return; const k=name.toLowerCase(); if(BU_SET[k]){bu=BU_SET[k];return;} if(["client","subtotal","total","new clients"].includes(k)||!bu) return; dash[name]={bu,sales:r[2]||"",delivery:r[3]||"",billing:r[4]||""}; });
  const skip=new Set(["Dashboard (RunRate)","Dashboard (Projection)","IT Avalon Actual & Projection","WorkingDays","Costing Sheet","Billing Loss","Replacement Data","Template(Hours)","TEMPLATE","Costco (Prototype)","Sheet1"]);
  const tabs=[];
  for(const name of wb.SheetNames){ if(skip.has(name)) continue; const r=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true}); const hdr=(r[3]||[]).map(x=>(x??"").toString().toLowerCase());
    if(!hdr.some(h=>h.startsWith("resource"))) continue; let people=0,noloc=0,ext=0; const noLocNames=[]; const ci=hdr.findIndex(h=>h.startsWith("location")); const months=(r[2]||[]).filter(x=>typeof x==="string"&&/^[a-z]+/i.test(x)).length; const extCols=hdr.filter(h=>h.startsWith("extension start")).length;
    for(let i=4;i<r.length;i++){ const n=(r[i][0]??"").toString().trim(); if(!n) continue; if(/^totals?$/i.test(n)) break; if(!(r[i][1]||r[i][hdr.findIndex(h=>h.startsWith("rate"))])) continue; people++; if(ci>=0&&!r[i][ci]){ noloc++; noLocNames.push(n); } if(extCols) ext+=hdr.map((h,j)=>h.startsWith("extension start")&&r[i][j]?1:0).reduce((a,b)=>a+b,0); }
    const ALIAS={"station casinos":"Stations Casino","caesars":"Caesars Palace (Project)","caesers entertainment":"Caesars Entertainment (Staffing)","blue shield-vms":"BCBS Ca-VMS","christus health-vms":"Christus Health","dreamscape":"Dreamscape (added line)","first citizens":"First Citizens + VMS","sierra nevada":"Sierra Nevada + VMS","costco":"Costco Travel","deloitte":"Deloitte (India)"};
    const key=(ALIAS[name.toLowerCase()]&&dash[ALIAS[name.toLowerCase()]])?ALIAS[name.toLowerCase()]:Object.keys(dash).find(k=>k.toLowerCase().replace(/[^a-z]/g,"").startsWith(name.toLowerCase().replace(/[^a-z]/g,"").slice(0,8)));
    tabs.push({tab:name,client:key||name,bu:key?dash[key].bu:"",billing:key?dash[key].billing:"",sales:key?dash[key].sales:"",delivery:key?dash[key].delivery:"",people,ext,months,noloc,noLocNames,onDash:!!key}); }
  const blockers=[];
  for(const t of tabs){
    if(!t.onDash) blockers.push({kind:"business_unit",tab:t.tab,detail:`not on the run-rate dashboard, so it has no business unit, sales owner or billing type (${t.people} people)`,
      fix:`Add '${t.tab}' to the Dashboard (RunRate) tab under its business unit, with sales owner, delivery owner and billing type.`});
    if(t.noloc) blockers.push({kind:"location",tab:t.tab,detail:`${t.noloc} ${t.noloc===1?"person has":"people have"} no Location, and a blank location is charged US burden and the US floor`,
      fix:`Fill the Location column on the ${t.tab} tab for: ${t.noLocNames.slice(0,12).join(", ")}${t.noLocNames.length>12?` and ${t.noLocNames.length-12} more`:""}`});
  }
  return {dash,tabs,blockers};
}
function renderImport(){
  const r=view.dry;
  $("#main").innerHTML=`<div class="top"><div><h1>Import the forecast model</h1><div class="sub">The FY forecast model master (one tab per client, one row per person, month blocks). Dry run first — nothing is created until you confirm.</div></div></div>
  <div class="panel" style="max-width:880px;margin-bottom:12px"><h2>1 · Upload the workbook</h2><div class="bar"><input class="in" type="file" id="m-file" accept=".xlsx"><span class="mini" id="m-msg"></span></div>
   <p class="mini">What the importer does: <b>dashboard</b> → business unit, sales owner, delivery owner, billing type per client · <b>client tab</b> → one engagement per SOW/PO (<i>Team/SOW</i> column) · <b>row</b> → one allocation per person, plus one per extension-date pair · <b>Actual</b> months → billed revenue and hours (vacation and unplanned leave deducted) · <b>WorkingDays</b> → holidays per location. A flat Max Billing every month (Costco-style 173 h) becomes a monthly rate; <i>-OVERTIME</i> / <i>-ON CALL</i> rows carry actuals only; CLOSED tabs import as closed.</p></div>
  ${r?r.error?`<div class="proto red">${r.error}</div>`:`<div class="panel" style="max-width:880px;margin-bottom:12px"><h2>2 · Dry run — what would be created</h2>
   <div class="cards" style="margin:10px 0">${["ST21","IT Avalon","Retro Rabbit",""].map(b=>{const t=r.tabs.filter(x=>x.bu===b);return `<div class="card"><div class="k">${b||"Not on the dashboard"}</div><div class="v">${t.length}</div><div class="d">client tabs · ${t.reduce((a,x)=>a+x.people,0)} people · ${t.reduce((a,x)=>a+x.ext,0)} extensions</div></div>`}).join("")}</div>
   <div class="wrap"><table><thead><tr><th>Tab</th><th>Client (dashboard)</th><th>BU</th><th>Billing type</th><th>Sales · Delivery</th><th class="n">People</th><th class="n">Extensions</th><th class="n">Months</th><th>Needs attention</th></tr></thead><tbody>
   ${r.tabs.map(t=>`<tr><td><b>${t.tab}</b></td><td>${t.client}</td><td>${t.bu||'<span class="red">—</span>'}</td><td>${t.billing||"—"}</td><td class="mini">${t.sales||"—"} · ${t.delivery||"—"}</td><td class="n">${t.people}</td><td class="n">${t.ext}</td><td class="n">${t.months}</td><td class="mini">${[!t.onDash?"not on the dashboard — pick a BU":"",t.noloc?t.noloc+" people without a location":""].filter(Boolean).join(" · ")||"—"}</td></tr>`).join("")}
   </tbody></table></div>
   <p class="mini" style="margin-top:8px">Not loaded from this workbook: <b>costs</b> (the Costing Sheet is empty — every imported person is <i>cost unknown</i> and the engagement shows INCOMPLETE until the rate card or a cost per hour is set) · clients that exist only as a number on the dashboard (no tab) · currency for Retro Rabbit (assumed USD).</p>
   ${r.blockers.length?`<div class="panel blocked" style="margin-top:12px"><h2>Fix these in the workbook before loading</h2>
     <p class="mini">Each one is a blank cell. Loading anyway would file the rows under a default — the totals on screen would still add up, and only the margin underneath would be wrong — so the import stops here instead.</p>
     <ul class="fixlist">${r.blockers.map(b=>`<li><b>${b.tab}</b> — ${b.detail}.<br><span class="mini">${b.fix}</span></li>`).join("")}</ul>
     <div class="bar"><button class="btn" disabled title="Fill the cells above and upload again">Load ${r.tabs.reduce((a,x)=>a+x.people,0)} people into ${r.tabs.length} clients</button>
      <span class="mini">${r.blockers.length} thing${r.blockers.length===1?"":"s"} to fix · re-upload when the workbook carries them</span></div></div>`
   :`<div class="bar" style="margin-top:10px"><button class="btn" id="m-load">Load ${r.tabs.reduce((a,x)=>a+x.people,0)} people into ${r.tabs.length} client${r.tabs.length===1?"":"s"}</button><span class="mini">In the prototype this creates sample engagements with the counts above; the real importer creates the allocations and actuals.</span></div>`}</div>`:""}`;
  $("#m-file").onchange=async ev=>{ const file=ev.target.files[0]; if(!file) return; try{ const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array",cellDates:true}); view.dry=dryRunModel(wb); render(); } catch(err){ $("#m-msg").innerHTML='<span class="red">Could not read that file: '+err.message+'</span>'; } };
  const L=$("#m-load"); if(L) L.onclick=()=>{ r.tabs.forEach(t=>{ if(!DB.clients.includes(t.client)) DB.clients.push(t.client);
      DB.engagements.push({id:"e"+(uid++),client:t.client,bu:t.bu,salesOwner:t.sales,deliveryOwner:t.delivery,name:`${t.tab} (imported from the forecast model)`,type:/fixed/i.test(t.billing)?"msp":"time_and_materials",start:"2026-01-01",end:"2026-12-31",addlFlag:false,sameDates:true,owner:t.sales,hubspot:"—",
        allocs:Array.from({length:Math.min(t.people,6)},(_,i)=>({id:nid(),person:`Person ${i+1}`,role:"Imported",seniority:"Mid",location:"US",emp:"w2_employee",assignment:"",util:1,bill:100,basis:"hourly",cost:null,start:"",end:""})),costs:[],importWarnings:["Imported from the forecast model: cost per hour unknown — set the rate card or a cost per hour; check the location of each person."]}); });
    save(); view.dry=null; view.page="portfolio"; view.bu=""; render(); };
}
function render(){ renderNav(); if(view.page==="portfolio") renderPortfolio(); else if(view.page==="new") renderNew(); else if(view.page==="settings") renderSettings(); else if(view.page==="import") renderImport(); else renderEng(); }
render();
</script>
