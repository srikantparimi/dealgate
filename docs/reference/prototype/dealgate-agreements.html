function validateFile(f){return new Promise(res=>{const ext=(f.name.match(/\.([A-Za-z0-9]+)$/)||[])[1]?.toLowerCase();if(!['pdf','docx'].includes(ext))return res({ok:false,msg:'Only PDF and Word (.docx) files can be uploaded.'});if(f.size>25*1024*1024)return res({ok:false,msg:'This file is larger than 25 MB.'});if(f.size===0)return res({ok:false,msg:'This file is empty.'});
 if(f.sample)return res({ok:true,ext});const r=new FileReader();r.onload=()=>{const b=new Uint8Array(r.result);const pdf=b[0]===0x25&&b[1]===0x50&&b[2]===0x44&&b[3]===0x46,zip=b[0]===0x50&&b[1]===0x4B&&b[2]===3&&b[3]===4;if(ext==='pdf'&&!pdf)return res({ok:false,msg:'This file is named .pdf but its contents are not a PDF.'});if(ext==='docx'&&!zip)return res({ok:false,msg:'This file is named .docx but its contents are not a Word document.'});res({ok:true,ext});};r.onerror=()=>res({ok:false,msg:'This file could not be read.'});r.readAsArrayBuffer(f.slice(0,8));});}
function openUpload(o={}){if(!canWrite()){toast('Only Legal and SystemAdmin can change agreements. You can view and download.');return;}

 dialog(o.std?`Upload standard ${kind}`:'Upload a document',`<div class="pf-form-grid"><label class="pf-form-label">Document type<select id="pf-up-kind"><option ${kind==='NDA'?'selected':''}>NDA</option><option ${kind==='MSA'?'selected':''}>MSA</option></select></label><label class="pf-form-label">What is this?<select id="pf-up-target" ${c?'disabled':''}><option value="client" ${target==='client'?'selected':''}>Client copy (for one client)</option><option value="std" ${target==='std'?'selected':''}>Standard copy (for many clients)</option></select></label></div>
 <label class="pf-form-label" id="pf-up-client-wrap" ${target==='std'?'hidden':''}>Client${c?`<input id="pf-up-client" value="${esc(c.name)}" readonly>`:`<input id="pf-up-client" list="pf-client-list" placeholder="Start typing a client name" autocomplete="off"><datalist id="pf-client-list">${sortRows(clients).map(x=>`<option value="${esc(x.name)}"></option>`).join('')}</datalist>`}</label>
 <label class="pf-form-label" id="pf-up-notetext-wrap" ${target==='std'?'hidden':''} style="margin-top:10px">Note about this version (optional)<input id="pf-up-notetext" maxlength="200" placeholder="For example: updated payment terms"></label><div id="pf-up-note"></div>

 <div id="pf-up-msg" aria-live="polite"></div><div class="pf-progress" id="pf-up-progress" hidden><i></i></div>
 <div class="pf-std-actions" style="margin-top:14px"><button class="pf-button pf-primary" id="pf-up-go" data-action="do-upload" disabled>Upload</button><button class="pf-button" data-action="${o.fromWiz?'back-wizard':'close'}">${o.fromWiz?'Back to attach':'Cancel'}</button></div>`,o.std?'Standard copy':'Upload');upNote();}
function upNote(){const k=$('pf-up-kind').value,t=$('pf-up-target').value;let msg='';if(t==='std'){const s=state.std[k];msg=s?`<div class="pf-info">This adds version ${s.v+1} of the standard ${k}. Copies already attached to clients stay as they are.</div>`:`<div class="pf-info">This becomes the standard ${k}. You attach it to existing clients in one step afterwards.</div>`;}
 else{const name=$('pf-up-client').value.trim().toLowerCase(),c=clients.find(x=>x.name.toLowerCase()===name);if(c&&c.docs[k]&&c.docs[k].status==='standard')msg=`<div class="pf-callout">This client holds the standard ${esc(k)}. Your upload replaces it for this client only. The standard copy stays for everyone else.</div>`;else if(c&&c.docs[k]&&c.docs[k].status!=='covered')msg=`<div class="pf-callout">This adds a new version of this client's ${esc(k)}. The earlier version stays in history.</div>`;}
 $('pf-up-note').innerHTML=msg;}
async function pickFile(f){const m=$('pf-up-msg'),drop=$('pf-drop');state.pending.file=null;$('pf-up-go').disabled=true;if(!f){return;}const v=await validateFile(f);if(!v.ok){drop.className='pf-drop bad';$('pf-drop-text').textContent=f.name;m.innerHTML=`<div class="pf-error" role="alert">${esc(v.msg)}</div>`;return;}
 drop.className='pf-drop ok';$('pf-drop-text').textContent=f.name+' · '+kb(f.size);m.innerHTML=`<p class="pf-subline">Will be stored as <code>${esc(safeName(f.name))}</code></p>`;state.pending.file={name:safeName(f.name),size:f.size};$('pf-up-go').disabled=false;}
function doUpload(){const p=state.pending;if(!p||!p.file)return;const k=$('pf-up-kind').value,t=$('pf-up-target').value;let c=null;
 if(t==='client'){const name=$('pf-up-client').value.trim().toLowerCase();c=clients.find(x=>x.name.toLowerCase()===name);if(!c){$('pf-up-msg').innerHTML='<div class="pf-error" role="alert">Choose a client from the list.</div>';return;}}
 $('pf-up-go').disabled=true;const bar=$('pf-up-progress');bar.hidden=false;let pct=0;const iv=setInterval(()=>{pct+=25;bar.firstElementChild.style.width=pct+'%';if(pct>=100){clearInterval(iv);finishUpload(k,t,c,p);}},90);}

 if(t==='std'){const prev=state.std[k];state.std[k]={name:f.name,size:f.size,v:prev?prev.v+1:1,by:u.name,at:TODAY};log(`Uploaded standard ${k} version ${state.std[k].v} (${f.name})`);const w=p.fromWiz;closeDialog();render();toast(`Standard ${k} v${state.std[k].v} uploaded.`);if(w)openWizard();return;}

 c.docs[k]={status:'covered',name:null,by:user().name,at:date,reason:$('pf-mk-reason').value,note:$('pf-mk-note').value.trim(),src:'DealGate'};log(`Marked ${k} covered for ${c.name} (${c.docs[k].reason})`);render();clientPanel(id);toast(`${k} marked covered.`);}

function openRel(id){const c=clients.find(x=>x.id===id);dialog('Change relationship',`<p>Existing clients are covered by the standard copies. Net-new clients need their own copy. Use this to correct a client, for example a duplicate or a test record.</p><label class="pf-form-label">Relationship<select id="pf-rel"><option value="existing" ${c.rel==='existing'?'selected':''}>Existing: worked with before</option><option value="net" ${c.rel==='net'?'selected':''}>Net new</option></select></label><div class="pf-std-actions" style="margin-top:14px"><button class="pf-button pf-primary" data-action="do-rel" data-id="${id}">Save</button><button class="pf-button" data-client="${id}">Cancel</button></div>`,esc(c.name));}

/* ---------- bulk attach (one-time backfill) ---------- */
function wizTargets(){const kinds=KINDS.filter(k=>state.wiz.kinds[k]&&state.std[k]);const need=c=>kinds.some(k=>!c.docs[k]);
 const ex=clients.filter(c=>c.rel==='existing'),pipe=clients.filter(c=>c.rel==='net'&&reqState(c)==='req'&&!c.test);
 const rule=ex.filter(c=>c.test||stage1Only(c)),base=ex.filter(c=>!c.test&&!stage1Only(c));
 const done=[...base,...pipe].filter(c=>!need(c)).length;
 const rows=[...base.filter(need).map(c=>({c,why:'',def:true})),...pipe.filter(need).map(c=>({c,why:'Net new · in pipeline',info:true,def:true})),...rule.map(c=>({c,why:c.test?'Test data':'Deals only in stage 1',def:false}))];
 return{kinds,rows,done,netTotal:clients.filter(c=>c.rel==='net').length};}
function openWizard(){if(!isAdmin()){toast('Only SystemAdmin can attach standard copies in bulk.');return;}if(!state.wiz)state.wiz={step:1,kinds:{NDA:true,MSA:true},include:null,typed:'',running:false,progress:0,done:null};wizRender();}
function wizChosen(){const t=wizTargets();if(!state.wiz.include)state.wiz.include=new Set(t.rows.filter(r=>r.def).map(r=>r.c.id));return t;}
function wizRender(){const w=state.wiz,t=wizChosen(),n=t.rows.filter(r=>w.include.has(r.c.id)).length;const steps=['1 · Standard copies','2 · Review','3 · Confirm and run'].map((s,i)=>`<span class="${w.step===i+1?'on':''}">${s}</span>`).join('');let body='';
 if(w.step===1){body=`<p>Attach your standard copies to existing clients in one step. Nothing is attached until you confirm on the last step.</p>${KINDS.map(k=>{const s=state.std[k];return `<div class="pf-doc-card"><h3><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-wiz-kind="${k}" ${w.kinds[k]&&s?'checked':''} ${s?'':'disabled'}> Attach the standard ${k}</label>${s?`<span class="pf-tag purple">v${s.v}</span>`:'<span class="pf-tag amber">Not uploaded</span>'}</h3>${s?`<p class="pf-subline" style="margin:0">${esc(s.name)} · uploaded ${esc(fmtDate(s.at))} by ${esc(s.by)}</p>`:`<div class="pf-std-actions"><button class="pf-button pf-primary" data-wiz-upload="${k}">↑ Upload standard ${k}</button></div>`}</div>`;}).join('')}<div class="pf-std-actions"><button class="pf-button pf-primary" data-action="wiz-next" ${t.kinds.length?'':'disabled'}>Review who gets them →</button></div>`;}
 else if(w.step===2){const inc=t.rows.filter(r=>w.include.has(r.c.id)),netInc=inc.filter(r=>r.c.rel==='net').length;body=`<p>This is a dry run. No client changes yet.</p><div class="pf-count-grid"><span>Clients that will receive copies</span><b id="pf-wiz-n">${n}</b><span>of which net-new clients in the pipeline past stage 1</span><b id="pf-wiz-net">${netInc}</b><span>Clients already holding the chosen documents</span><b>${t.done}</b><span>Net-new clients not included (stage 1 or no active deal)</span><b>${t.netTotal-netInc}</b></div><h3>Clients</h3><p class="pf-subline">Existing clients and net-new clients past stage 1 start ticked. Untick any client to leave it out. Clients with deals only in stage 1 and test data start unticked.</p><div class="pf-scroll-list">${t.rows.map(r=>`<label><input type="checkbox" data-wiz-inc="${r.c.id}" ${w.include.has(r.c.id)?'checked':''}> <span>${esc(r.c.name)}</span>${r.why?`<span class="pf-tag ${r.info?'purple':'amber'}">${esc(r.why)}</span>`:''}</label>`).join('')||'<p class="pf-subline">No clients need copies.</p>'}</div><div class="pf-std-actions"><button class="pf-button" data-action="wiz-back">← Back</button><button class="pf-button pf-primary" data-action="wiz-next" ${n?'':'disabled'}>Continue →</button></div>`;}
 else{const word='ATTACH '+n;if(w.done){body=`<div class="pf-info"><strong>Done.</strong> Batch ${esc(w.done.id)} attached ${t.kinds.join(' and ')} to ${w.done.n} clients. Every attachment is credited to ${esc(user().name)} and recorded in the audit log.</div><p>Existing and net new are now fixed as of ${esc(fmtDate(TODAY))}. You can undo this batch from the page header. Undo removes only what this batch attached.</p><div class="pf-std-actions"><button class="pf-button pf-primary" data-action="close">Close</button></div>`;}
  else if(w.running)body=`<p>Attaching in groups of 25. You can leave this open; it keeps running.</p><div class="pf-progress"><i style="width:${w.progress}%"></i></div><p class="pf-subline" id="pf-wiz-pct">${w.progress}%</p>`;
  else{const netInc=t.rows.filter(r=>w.include.has(r.c.id)&&r.c.rel==='net').length;body=`<p>You are about to attach <strong>${t.kinds.join(' and ')}</strong> to <strong>${n}</strong> clients (${n-netInc} existing, ${netInc} net new in the pipeline). A client that already has one keeps it. Net-new clients that receive a copy stay net new and show “Standard copy”; replace it from the client panel when they need their own version.</p><label class="pf-form-label">Type <b>${word}</b> to confirm<input id="pf-wiz-typed" autocomplete="off" value="${esc(w.typed)}"></label><div class="pf-std-actions" style="margin-top:14px"><button class="pf-button" data-action="wiz-back">← Back</button><button class="pf-button pf-primary" id="pf-wiz-run" data-action="wiz-run" ${w.typed===word?'':'disabled'}>Attach now</button></div>`;}}
 dialog('Attach standard copies',`<div class="pf-steps">${steps}</div>${body}`,'One-time backfill');}
function wizRun(){const w=state.wiz,t=wizTargets(),ids=[...w.include],kinds=t.kinds,id='AG-000'+(state.batches.length+1);w.running=true;w.progress=0;wizRender();let i=0;const iv=setInterval(()=>{i+=25;w.progress=Math.min(100,Math.round(i/ids.length*100));const pct=$('pf-wiz-pct');if(pct){pct.textContent=w.progress+'%';root.querySelector('.pf-progress i').style.width=w.progress+'%';}
 if(i>=ids.length){clearInterval(iv);let n=0;ids.forEach(cid=>{const c=clients.find(x=>x.id===cid);let any=false;kinds.forEach(k=>{if(!c.docs[k]){c.docs[k]={status:'standard',name:state.std[k].name,size:state.std[k].size,by:user().name,at:TODAY,ver:state.std[k].v,batch:id};any=true;}});if(any)n++;});
  if(!state.cutover)state.cutover=TODAY;state.batches.push({id,at:TODAY,by:user().name,kinds,n,undone:false});log(`Attached standard ${kinds.join(' and ')} to ${n} clients (batch ${id})`);w.running=false;w.done={id,n};render();wizRender();}},120);}
function undoBatch(id){const b=state.batches.find(x=>x.id===id);const n=clients.reduce((a,c)=>a+KINDS.filter(k=>c.docs[k]&&c.docs[k].batch===id).length,0);dialog('Undo batch '+id,`<p>This removes the <strong>${n}</strong> standard attachments made by batch ${esc(id)}. It does not touch client copies, marks, or anything attached another way. The standard files and the cutover date stay.</p><div class="pf-std-actions"><button class="pf-button pf-primary" data-action="do-undo" data-batch="${esc(id)}">Undo batch</button><button class="pf-button" data-action="close">Cancel</button></div>`,'Undo');}
function doUndo(id){const b=state.batches.find(x=>x.id===id);let n=0;clients.forEach(c=>KINDS.forEach(k=>{if(c.docs[k]&&c.docs[k].batch===id){c.docs[k]=null;n++;}}));b.undone=true;log(`Undid batch ${id}: removed ${n} standard attachments`);closeDialog();render();toast(`Batch ${id} undone: ${n} attachments removed.`);}

function applyMap(){let n=0;clients.forEach(c=>{if(c.hs&&state.map[c.hs]==='covered'&&!c.docs.MSA){c.docs.MSA={status:'covered',name:null,by:user().name,at:TODAY,reason:'Per HubSpot',note:'msa_type “'+c.hs+'”',src:'HubSpot msa_type'};n++;}});log(`Applied HubSpot msa_type mapping: marked MSA covered for ${n} clients`);closeDialog();render();toast(`MSA marked covered for ${n} clients.`);}
/* ---------- other dialogs ---------- */
function whereDialog(){const k=counts(),sample=clients.find(attention)||clients.find(c=>c.rel==='net');dialog('Where the warning appears',`<p>Warn and flag only. Nothing is blocked anywhere.</p><h3>Pipeline: opportunity row</h3><div class="pf-mock"><span>${sample?esc(sample.name):'A net-new client'} · Proposal</span><span>${sample?docTag(sample,'NDA')+' '+docTag(sample,'MSA'):''}</span><small>NDA and MSA tags now show Client copy, Standard copy, Marked covered, Missing or Due at stage 2.</small></div><h3>Pipeline: Agreement gaps card</h3><div class="pf-mock"><span><strong>${k.att}</strong> clients need attention</span><small>Net new, past stage 1, NDA or MSA missing. The old card counted every client with an open deal (53 on staging tonight) and treated a missing file the same for existing clients.</small></div><h3>Command Center</h3><div class="pf-mock"><span>${k.att} net-new clients are past stage 1 without an NDA or MSA</span><small>Opens this page filtered to “Needs attention”.</small></div><h3>Client panel</h3><div class="pf-mock"><span>Net new, past stage 1, MSA missing.</span><small>Shown as an amber note on the client, with an Upload button for Legal and SystemAdmin.</small></div>`,'Agreements');}
function notesDialog(){dialog('What changed from the old page',`<h3>Kept</h3><p>The document list with client, type, file, uploader, date and download, replace with history, and search across all documents.</p><h3>New</h3><p>A client view with a status for every client and both documents; standard copies uploaded once; a one-time attach with preview, typed confirm, progress and undo; a client copy for any client, with a version note; “Marked covered” when the document exists elsewhere; a warning that counts only net-new clients past stage 1; HubSpot <code>msa_type</code> as a hint you can map; activity for every upload, attach, mark, undo and download.</p><h3>Fixed</h3><p>The search box now says what it searches. File contents are checked, not just the name. File names are stored with one extension. Every download is recorded.</p>`);}
function exportCSV(){const quote=v=>'"'+guard(v).replace(/"/g,'""')+'"';const rs=sortRows(filtered());const rec=[['Client','Business unit','Relationship','Basis','Furthest open stage','NDA','MSA','Needs attention','Possible duplicate'],...rs.map(c=>[c.name,BUS[c.bu].bu+' · '+BUS[c.bu].region,c.rel==='existing'?'Existing':'Net new',basisText(c).replace(/&amp;/g,'&'),stageText(c),stateLabel(docState(c,'NDA')),stateLabel(docState(c,'MSA')),attention(c)?'Yes':'No',c.dup?'Yes':'No'])];
 const out=rec.map(r=>r.map(quote).join(',')).join('\r\n');window.__lastCsv=out;dialog('Export ready',`<p><strong style="color:var(--p-ink)">${rs.length} clients</strong> from the filtered view, every row, not just this page. In the application this downloads <code>DealGate_Agreements.csv</code>. Cells that start with = + - or @ are prefixed with an apostrophe so a spreadsheet never runs them as formulas.</p><div class="pf-callout">Prototype only. Nothing is downloaded.</div><button class="pf-button" data-action="close">Close</button>`);}
const guard=v=>{v=String(v??'');return /^[=+\-@\t\r]/.test(v)?"'"+v:v;};
const stateLabel=t=>({client:'Client copy',standard:'Standard copy',covered:'Marked covered',missing:'Missing',later:'Due at stage 2',na:'Not needed now',exnone:'Existing, none attached'})[t]||t;
/* ---------- events ---------- */
root.addEventListener('change',e=>{const t=e.target,id=t.id;
 if(id==='pf-class'){state.cls=t.value;change();}else if(id==='pf-status'){state.status=t.value;change();}else if(id==='pf-stage'){state.stage=t.value;change();}else if(id==='pf-bu'){state.bu=t.value;change();}else if(id==='pf-sort'){state.sort=t.value;state.page=0;renderRows();}else if(id==='pf-page-size'){state.pageSize=Number(t.value);state.page=0;renderRows();}
 else if(id==='pf-up-kind'||id==='pf-up-target'){if(id==='pf-up-target'){$('pf-up-client-wrap').hidden=t.value==='std';$('pf-up-notetext-wrap').hidden=t.value==='std';}upNote();}
 else if(id==='pf-file'){pickFile(t.files[0]);}
 else if(t.dataset.wizKind){state.wiz.kinds[t.dataset.wizKind]=t.checked;state.wiz.include=null;wizRender();}
 else if(t.dataset.wizInc){t.checked?state.wiz.include.add(t.dataset.wizInc):state.wiz.include.delete(t.dataset.wizInc);$('pf-wiz-n').textContent=state.wiz.include.size;{const t=wizTargets();$('pf-wiz-net').textContent=t.rows.filter(r=>r.c.rel==='net'&&state.wiz.include.has(r.c.id)).length;}root.querySelector('[data-action="wiz-next"]').disabled=state.wiz.include.size===0;}
 else if(t.dataset.map){state.map[t.dataset.map]=t.value;const n=clients.filter(c=>c.hs&&state.map[c.hs]==='covered'&&!c.docs.MSA).length;$('pf-map-note').textContent=n+' clients would be marked.';}});
root.addEventListener('input',e=>{const id=e.target.id;if(id==='pf-search'){state.search=e.target.value;state.page=0;if(state.tab==='clients')render();else renderRows();}else if(id==='pf-up-client')upNote();else if(id==='pf-wiz-typed'){state.wiz.typed=e.target.value.trim();const n=state.wiz.include.size;$('pf-wiz-run').disabled=state.wiz.typed!=='ATTACH '+n;}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(b.hasAttribute('data-locked')){toast(b.dataset.locked==='admin'?'Only SystemAdmin can do this.':'Only Legal and SystemAdmin can change agreements. You can view and download.');return;}
 if(d.demoData){seed(d.demoData);reset();closeDialogQuiet();render();return;}if(d.demoRole){state.role=d.demoRole;closeDialogQuiet();render();return;}if(d.demoHs){state.hs=d.demoHs;render();return;}
 if(d.tab){state.tab=d.tab;state.page=0;state.search='';render();return;}
 if(d.metric){reset();state.tab='clients';const m=d.metric;if(m==='existing')state.cls='existing';else if(m==='net')state.cls='net';else if(m==='attention')state.status='attention';else if(m==='std')state.status='std';else if(m==='client')state.status='client';change();return;}
 if(d.client){clientPanel(d.client);return;}if(d.upload){openUpload({clientId:d.upload,kind:d.kind||'NDA'});return;}
 if(d.uploadStd){openUpload({std:true,kind:d.uploadStd});return;}if(d.wizUpload){openUpload({std:true,kind:d.wizUpload,fromWiz:true});return;}
 if(d.downloadStd){const k=d.downloadStd;log(`Downloaded the standard ${k}`);render();toast(`A download link for the standard ${k} was created. It expires in 5 minutes and the download is recorded.`);return;}
 if(d.download){const[id,k]=d.download.split('|'),c=clients.find(x=>x.id===id);log(`Downloaded ${k} for ${c.name}`);render();toast(`A download link for ${c.name}'s ${k} was created. It expires in 5 minutes and the download is recorded.`);return;}
 if(d.mark){const[id,k]=d.mark.split('|');openMark(id,k);return;}if(d.remove){const[id,k]=d.remove.split('|');openRemove(id,k);return;}if(d.rel){openRel(d.rel);return;}
 if(d.attachOne){const[id,k]=d.attachOne.split('|'),c=clients.find(x=>x.id===id);c.docs[k]={status:'standard',name:state.std[k].name,size:state.std[k].size,by:user().name,at:TODAY,ver:state.std[k].v};log(`Attached standard ${k} to ${c.name}`);render();clientPanel(id);toast(`Standard ${k} attached.`);return;}
 if(d.clearKey){const k=d.clearKey;state[k]=defaults()[k];change();return;}
 if(d.destination){const c=clients.find(x=>x.id===d.destination);dialog('Pipeline',`<p>In the application this opens Pipeline filtered to ${esc(c.name)}.</p><div class="pf-callout">Prototype only.</div><button class="pf-button" data-client="${c.id}">← Return to client</button>`);return;}
 if(d.wizUpload===undefined&&d.action===undefined)return;
 const a=d.action;
 if(a==='close')closeDialog();else if(a==='theme'){const scheme=getComputedStyle(root).colorScheme,dark=scheme==='dark'||scheme==='light dark'&&window.matchMedia?.('(prefers-color-scheme: dark)').matches;root.style.colorScheme=dark?'light':'dark';}
 else if(a==='clear'){reset();render();}else if(a==='prev'){state.page=Math.max(0,state.page-1);renderRows();}else if(a==='next'){state.page++;renderRows();}
 else if(a==='upload')openUpload({});else if(a==='bulk'){state.wiz=null;openWizard();}else if(a==='back-wizard'){state.pending=null;openWizard();}
 else if(a==='sample-file'){const k=$('pf-up-kind').value;pickFile({name:'Sample '+k+'.pdf',size:182000,sample:true});}
 else if(a==='do-upload')doUpload();else if(a==='do-mark')doMark(d.id,d.kind);else if(a==='do-remove')doRemove(d.id,d.kind);else if(a==='do-rel')doRel(d.id);
 else if(a==='wiz-next'){state.wiz.step++;wizRender();}else if(a==='wiz-back'){state.wiz.step--;wizRender();}else if(a==='wiz-run')wizRun();
 else if(a==='undo-batch')undoBatch(d.batch);else if(a==='do-undo')doUndo(d.batch);
 else if(a==='hubspot-hints')hubspotDialog();else if(a==='apply-map')applyMap();else if(a==='export')exportCSV();else if(a==='where')whereDialog();else if(a==='design-notes')notesDialog();
 else if(a==='sim-won'){const c=clients.find(x=>x.id===d.id);c.deals=c.deals.filter(x=>!isOpen(x));c.deals.push(W());render();clientPanel(c.id);toast('Deal closed Won. The client stays net new, so its agreements are still required.');}
});
function closeDialogQuiet(){if(!$('pf-modal').hidden)closeDialog();}
$('pf-modal').addEventListener('click',e=>{if(e.target===$('pf-modal'))closeDialog();});
root.addEventListener('keydown',e=>{if($('pf-modal').hidden)return;if(e.key==='Escape'){closeDialog();return;}if(e.key==='Tab'){const controls=[...$('pf-modal').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled&&!x.hidden),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.__dg={get clients(){return clients},state,counts};
seed('tonight');render();
})();

</script>
</div>
